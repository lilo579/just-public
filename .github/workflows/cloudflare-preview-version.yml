name: Cloudflare Preview Version

# CF-006 — Controlled CI: create a Worker Version + smoke Preview URL.
# NEVER promotes traffic (no versions deploy / rollback / wrangler deploy).
#
# Trigger: workflow_dispatch only until remote certification.
# Push → main may be enabled later after the first green remote run.

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKER_NAME: just-public-poc
  # Bootstrap Version that must remain 100% of the active Deployment (CF-005 final state).
  EXPECTED_ACTIVE_VERSION_ID: 3047d28b-9830-4a10-8104-6d783f57ef4f

jobs:
  preview-version:
    name: Upload preview version (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-preview
    defaults:
      run:
        working-directory: just-public
    steps:
      - name: Checkout Public
        uses: actions/checkout@v4
        with:
          path: just-public

      - name: Checkout Nexus authority
        uses: actions/checkout@v4
        with:
          repository: lilo579/just-auth-nexus
          ref: main
          path: just-auth-nexus
          ssh-key: ${{ secrets.NEXUS_READ_SSH_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: just-public/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static workflow policy gate
        run: node scripts/ci/assert-workflow-policy.mjs --file .github/workflows/cloudflare-preview-version.yml

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Wrangler deploy dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is required" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID variable is required" >&2
            exit 1
          fi
          npx wrangler deploy --dry-run | tee /tmp/wrangler-dry-run.txt
          grep -q 'env.ASSETS' /tmp/wrangler-dry-run.txt
          grep -q 'DEPLOY_ENV ("preview")' /tmp/wrangler-dry-run.txt
          grep -q 'POC_FIXTURE_MODE ("true")' /tmp/wrangler-dry-run.txt
          ! grep -qi 'nodejs_compat' /tmp/wrangler-dry-run.txt

      - name: Upload Worker Version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          npx wrangler versions upload \
            --name "${WORKER_NAME}" \
            --message "CF-006 CI preview ${GITHUB_SHA}" \
            --tag "git-${SHORT_SHA}" \
            2>&1 | tee /tmp/wrangler-versions-upload.txt
          node scripts/ci/parse-cloudflare-version-output.mjs \
            --file /tmp/wrangler-versions-upload.txt \
            --github-output --json

      - name: Write metadata artifact
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION_ID}" ] || [ -z "${PREVIEW_URL}" ]; then
            echo "version_id/preview_url missing from upload step" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const meta = {
              commit_sha: process.env.GITHUB_SHA,
              worker: process.env.WORKER_NAME,
              version_id: process.env.VERSION_ID,
              preview_url: process.env.PREVIEW_URL,
              timestamp: new Date().toISOString(),
            };
            fs.writeFileSync("cf-preview-metadata.json", JSON.stringify(meta, null, 2) + "\n");
            console.log("wrote cf-preview-metadata.json");
          '

      - name: Smoke Preview URL
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          TIMEOUT_MS: "15000"
        run: node scripts/ci/smoke-cloudflare-preview.mjs

      - name: Assert Deployment unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --name "${WORKER_NAME}" --json \
            > /tmp/deployments.json
          EXPECTED_VERSION_ID="${EXPECTED_ACTIVE_VERSION_ID}" \
            node scripts/ci/assert-no-deployment-change.mjs --file /tmp/deployments.json

      - name: Job summary
        if: always() && steps.upload.outputs.version_id != ''
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          {
            echo "## CF-006 Cloudflare Preview Version"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| worker | \`${WORKER_NAME}\` |"
            echo "| version_id | \`${VERSION_ID}\` |"
            echo "| preview_url | ${PREVIEW_URL} |"
            echo "| expected_active_version | \`${EXPECTED_ACTIVE_VERSION_ID}\` |"
            echo ""
            echo "Preview URL is public and serves **fictitious** Alpha/Beta/Gamma fixtures only."
            echo ""
            echo "This workflow does **not** promote Versions (\`versions deploy\` forbidden)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload metadata artifact
        if: always() && hashFiles('just-public/cf-preview-metadata.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cf-preview-metadata
          path: just-public/cf-preview-metadata.json
          retention-days: 7
          if-no-files-found: error
