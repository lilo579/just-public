# GO-003 — one-shot DNS + Custom Domain cutover for Marcelo Borer.
# Uses CLOUDFLARE_API_TOKEN (CI). Does NOT promote Worker Versions.
# Manual workflow_dispatch only.

name: GO-003 Marcelo Cutover DNS-CD

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "preflight | mutate | status"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - mutate
          - status

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-preview
    steps:
      - name: Cutover DNS + Custom Domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID}"
          ZONE_ID="84d7e90e704e0b9d58a69e7cc863b464"
          WORKER="just-public-production"
          LEGACY_IP="185.158.133.1"
          APEX="marceloborer.com.br"
          WWW="www.marceloborer.com.br"

          api() {
            local method="$1" path="$2"
            shift 2
            curl -sS -X "$method" "https://api.cloudflare.com/client/v4${path}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$@"
          }

          echo "=== PHASE=${PHASE} ==="
          echo "=== DNS snapshot ==="
          DNS_JSON="$(api GET "/zones/${ZONE_ID}/dns_records?per_page=100")"
          echo "$DNS_JSON" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('success', d.get('success'), 'errors', d.get('errors'))
          for r in d.get('result') or []:
            name=r.get('name'); typ=r.get('type'); content=r.get('content')
            if name in ('${APEX}','${WWW}') or typ in ('A','AAAA','CNAME','MX','TXT'):
              print(f\"{typ:6} {name:40} {content} proxied={r.get('proxied')} id={r.get('id')}\")
          "

          echo "=== Worker domains ==="
          api GET "/accounts/${ACCOUNT}/workers/domains" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('success', d.get('success'), 'errors', d.get('errors'))
          for r in d.get('result') or []:
            print(r.get('hostname'), r.get('service'), r.get('id'))
          "

          if [ "$PHASE" = "preflight" ] || [ "$PHASE" = "status" ]; then
            exit 0
          fi

          if [ "$PHASE" != "mutate" ]; then
            echo "Unknown phase" >&2
            exit 1
          fi

          echo "=== Delete legacy A records for apex/www only ==="
          echo "$DNS_JSON" | python3 -c "
          import json,sys,os,urllib.request
          d=json.load(sys.stdin)
          token=os.environ['CLOUDFLARE_API_TOKEN']
          zone='${ZONE_ID}'
          legacy='${LEGACY_IP}'
          targets={('${APEX}','A'),('${WWW}','A')}
          for r in d.get('result') or []:
            key=(r.get('name'), r.get('type'))
            if key in targets and r.get('content')==legacy:
              rid=r['id']
              print('DELETE', key, rid, r.get('content'))
              req=urllib.request.Request(
                f'https://api.cloudflare.com/client/v4/zones/{zone}/dns_records/{rid}',
                method='DELETE',
                headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},
              )
              with urllib.request.urlopen(req) as resp:
                body=json.load(resp)
              print(' result', body.get('success'), body.get('errors'))
              if not body.get('success'):
                raise SystemExit(2)
          "

          echo "=== Attach Custom Domains ==="
          for host in "$APEX" "$WWW"; do
            echo "ATTACH $host"
            RESP="$(api PUT "/accounts/${ACCOUNT}/workers/domains/records" \
              --data "{\"hostname\":\"${host}\",\"service\":\"${WORKER}\",\"environment\":\"production\"}")"
            echo "$RESP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('success', d.get('success'), 'errors', d.get('errors'))
          print('result', d.get('result'))
          if not d.get('success'):
            raise SystemExit(3)
          "
          done

          echo "=== Post domains ==="
          api GET "/accounts/${ACCOUNT}/workers/domains" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for r in d.get('result') or []:
            print(r.get('hostname'), r.get('service'), r.get('id'))
          "
