# GO-003 — Marcelo Borer DNS + Custom Domain cutover (READ-ONLY AUDIT)
#
# Pilot cutover COMPLETE (2026-08). This workflow is preserved for preflight/status
# snapshots only. DNS deletion and Custom Domain attachment are intentionally removed.
# Any new mutation requires a new workflow and explicit human approval.
#
# Does NOT promote Worker Versions. Manual workflow_dispatch only.

name: GO-003 Marcelo Cutover DNS-CD

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "preflight | status (read-only audit)"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - status

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-preview
    steps:
      - name: Read-only DNS + Worker domain snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SEO001_MARCELO_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "CLOUDFLARE_SEO001_MARCELO_TOKEN secret is required" >&2
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$PHASE" = "preflight" -o "$PHASE" = "status"

          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID}"
          ZONE_ID="84d7e90e704e0b9d58a69e7cc863b464"
          APEX="marceloborer.com.br"
          WWW="www.marceloborer.com.br"

          api() {
            local method="$1" path="$2"
            shift 2
            curl -sS -X "$method" "https://api.cloudflare.com/client/v4${path}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$@"
          }

          echo "=== PHASE=${PHASE} (read-only) ==="
          echo "=== DNS snapshot ==="
          DNS_JSON="$(api GET "/zones/${ZONE_ID}/dns_records?per_page=100")"
          echo "$DNS_JSON" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('success', d.get('success'), 'errors', d.get('errors'))
          if not d.get('success'):
            raise SystemExit(4)
          for r in d.get('result') or []:
            name=r.get('name'); typ=r.get('type'); content=r.get('content')
            if name in ('${APEX}','${WWW}') or typ in ('A','AAAA','CNAME','MX','TXT'):
              print(f\"{typ:6} {name:40} {content} proxied={r.get('proxied')} id={r.get('id')}\")
          "

          echo "=== Worker domains (GET only) ==="
          api GET "/accounts/${ACCOUNT}/workers/domains" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('success', d.get('success'), 'errors', d.get('errors'))
          for r in d.get('result') or []:
            print(r.get('hostname'), r.get('service'), r.get('id'))
          "
