# SEO-001 — Marcelo pilot LEGACY (READ-ONLY).
# Marcelo pilot completed; promotion retired.
# This workflow only verifies apex-final HTTP/SEO state. It MUST NOT promote,
# upload, deploy, or mutate Cloudflare traffic.
# Prefer seo001-promote-tenant.yml for future tenants (after allowlist enable + Environment).

name: SEO-001 Promote Marcelo Pilot

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "status — read-only apex-final verification"
        required: true
        default: "status"
        type: choice
        options:
          - status

concurrency:
  group: seo001-marcelo-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Public
        uses: actions/checkout@v4
        with:
          path: just-public

      - name: Checkout Nexus checker
        uses: actions/checkout@v4
        with:
          repository: lilo579/just-auth-nexus
          ref: main
          path: just-auth-nexus
          ssh-key: ${{ secrets.NEXUS_READ_SSH_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify apex-final canonical state (read-only)
        working-directory: just-public
        env:
          SEO001_NEXUS_ROOT: ${{ github.workspace }}/just-auth-nexus
        run: |
          set -euo pipefail
          test "${{ inputs.phase }}" = "status"
          for attempt in 1 2 3 4 5; do
            if node scripts/ci/seo001-post-deploy-verify.mjs \
              --primary marceloborer.com.br \
              --www www.marceloborer.com.br \
              --mode post_flip; then
              echo "marcelo_apex_final_verification_passed=true"
              exit 0
            fi
            sleep 3
          done
          echo "marcelo_apex_final_verification_failed=true" >&2
          exit 1

      - name: Audit outcome
        if: always()
        run: |
          {
            echo "## SEO-001 Marcelo legacy audit"
            echo "- Marcelo pilot completed; promotion retired"
            echo "- This workflow does not promote Worker versions"
            echo "- phase: status (HTTP apex-final verify only)"
          } >> "$GITHUB_STEP_SUMMARY"
