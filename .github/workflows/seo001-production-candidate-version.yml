name: SEO-001 Production Candidate Version

# Uploads a production-configured Worker Version without deploying it.
# No traffic, routes, DNS, or Custom Domains are changed.
on:
  workflow_dispatch:

concurrency:
  group: seo001-production-candidate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-preview
    defaults:
      run:
        working-directory: just-public
    steps:
      - name: Checkout Public
        uses: actions/checkout@v4
        with:
          path: just-public

      - name: Checkout Nexus authority
        uses: actions/checkout@v4
        with:
          repository: lilo579/just-auth-nexus
          ref: main
          path: just-auth-nexus
          ssh-key: ${{ secrets.NEXUS_READ_SSH_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            just-public/package-lock.json
            just-auth-nexus/package-lock.json

      - name: Install Nexus authority dependencies
        run: npm ci --prefix ../just-auth-nexus

      - name: Install Public dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Production dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --env production | tee /tmp/production-dry-run.txt
          grep -q 'DEPLOY_ENV ("production")' /tmp/production-dry-run.txt
          grep -q 'POC_FIXTURE_MODE ("false")' /tmp/production-dry-run.txt

      - name: Snapshot active production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --name just-public-production --json > /tmp/production-before.json

      - name: Upload production candidate version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload --env production \
            --message "SEO-001 production candidate ${GITHUB_SHA}" \
            2>&1 | tee /tmp/production-candidate-upload.txt
          node scripts/ci/parse-cloudflare-version-output.mjs \
            --file /tmp/production-candidate-upload.txt --github-output --json

      - name: Smoke candidate health only
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          BODY="$(curl -fsS "$PREVIEW_URL/health")"
          echo "$BODY" | grep -q '"status":"ok"'
          echo "$BODY" | grep -q '"canonicalContractVersion":"seo001-v1"'

      - name: Assert active production deployment unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deployments list --name just-public-production --json > /tmp/production-after.json
          cmp /tmp/production-before.json /tmp/production-after.json

      - name: Summary
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          echo "## SEO-001 production candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`${VERSION_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- preview: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- active production deployment: unchanged" >> "$GITHUB_STEP_SUMMARY"
